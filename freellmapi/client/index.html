<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        // Mirrors the ThemeProvider's resolution: 'system' (or nothing stored)
        // follows the OS preference. Keep in sync with src/theme.tsx.
        const theme = localStorage.getItem('theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const dark = theme === 'dark' || (theme !== 'light' && prefersDark)
        if (dark) {
          document.documentElement.classList.add('dark')
        }
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.documentElement.dataset.themeChoice =
          theme === 'dark' || theme === 'light' ? theme : 'system'
        // Same idea for text direction; keep in sync with RTL_LOCALES in
        // src/i18n/locale-config.ts.
        const locale = localStorage.getItem('freellmapi.locale')
        if (locale && ['ar', 'he', 'fa', 'ur'].includes(locale)) {
          document.documentElement.dir = 'rtl'
        }
      } catch {
        // Keep the initial render working if localStorage is unavailable.
      }
    </script>
    <title>Lujax</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
